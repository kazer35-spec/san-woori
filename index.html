<!-- ==========================================
     산:우리 긴급 점검 안내 화면 (점검 중 코드)
     ========================================== -->
<div id="maintenanceModal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    
    <div style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);">
        
        <!-- 아이콘 또는 이모지 -->
        <div style="font-size: 48px; margin-bottom: 16px; animation: bounce 2s infinite;">
            🛠️
        </div>
        
        <!-- 타이틀 -->
        <h2 style="color: #f8fafc; font-size: 20px; font-weight: 800; margin: 0 0 10px 0;">
            시스템 점검 중입니다
        </h2>
        
        <!-- 안내 문구 -->
        <p style="color: #94a3b8; font-size: 13px; line-height: 1.6; margin: 0 0 24px 0;">
            더 안정적인 서비스 제공과<br>데이터 정리를 위해 잠시 쉬어가는 중이에요.<br>조금만 기다려 주세요! 🙏
        </p>
        
        <!-- 상태 박스 -->
        <div style="background: rgba(15, 23, 42, 0.6); border-radius: 12px; padding: 12px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.05);">
            <div style="font-size: 11px; color: #38bdf8; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;">
                <span style="width: 6px; height: 6px; background-color: #38bdf8; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite;"></span>
                데이터베이스 업데이트 작업 중
            </div>
        </div>
        
        <!-- 새로고침 버튼 (필요시) -->
        <button onclick="location.reload()" style="background: #2563eb; color: white; border: none; width: 100%; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);">
            🔄 화면 새로고침
        </button>
        
    </div>
    
    <!-- 하단 크레딧 -->
    <div style="color: #64748b; font-size: 11px; margin-top: 24px; font-weight: 600;">
        산:우리 (SAN:WOORI)
    </div>
</div>

<style>
@keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}
</style>
